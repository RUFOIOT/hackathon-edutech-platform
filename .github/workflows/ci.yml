name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Los emuladores de Firebase requieren Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Tests de reglas de seguridad (emuladores)
        run: npm run test:rules

      # Playwright arranca `npm run build && next start` (ver playwright.config.ts): cubre también el build.
      - run: npx playwright install --with-deps chromium
      - name: Build y tests e2e
        run: npm run test:e2e
